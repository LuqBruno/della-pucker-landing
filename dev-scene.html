<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Inspeção local da cena — Della & Pucker</title><style>body{margin:0;background:#f0ede6;color:#252622;font:14px system-ui}header{padding:16px;display:flex;gap:16px;align-items:center}button,input,[contenteditable]{padding:10px;border:1px solid #666;background:#f0ede6}#scene{width:1600px;height:1100px;max-width:none}#paste{margin:16px;width:350px;min-height:40px}p{margin:16px}#status{min-width:220px}</style><header><button id="save" disabled>Salvar render estático</button><span id="status">Preparando cena…</span><label>Arquivo de captura <input id="name" value="qa-hero-desktop.jpg"></label></header><div id="paste" role="textbox" aria-label="Colar captura de tela" contenteditable="true">Cole a captura aqui</div><div id="scene"></div><script type="module">
import {createHouseScene} from './assets/house-scene.js';
const model=await createHouseScene(document.querySelector('#scene'));
model.setProgress(1,true);document.querySelector('#save').disabled=false;document.querySelector('#status').textContent='Cena pronta';
document.querySelector('#save').addEventListener('click',async()=>{const blob=await model.capture();const r=await fetch('/__capture?name=house-final.webp',{method:'POST',body:blob});document.querySelector('#status').textContent=await r.text();});
document.querySelector('#paste').addEventListener('paste',async e=>{const file=[...e.clipboardData.items].find(i=>i.type.startsWith('image/'))?.getAsFile();if(!file)return;e.preventDefault();const name=document.querySelector('#name').value;const r=await fetch('/__capture?name='+encodeURIComponent(name),{method:'POST',body:file});document.querySelector('#status').textContent=await r.text();});
</script></html>
